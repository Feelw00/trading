[tool.poetry]
name = "trading"
version = "0.1.0"
description = "트레이딩 리서치·집행 시스템 (openclaw cron/heartbeat가 트리거하는 Python 두뇌)"
authors = ["Lucas"]
packages = [{ include = "trading", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
pydantic = "^2.9"
tzdata = "*"
jinja2 = "^3.1.6"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
mypy = "^1.13"

[build-system]
requires = ["poetry-core>=1.9"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
