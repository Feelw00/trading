# trading.feelw00.com → 트레이딩 보고서 웹(127.0.0.1:8081, ops/start-report-site.sh)
# 2026-09-07: trand.feelw00.com 과 80 포트를 나눠 쓰기 위해 nginx 뒤로 이동(이전: python이 0.0.0.0:80 직접 바인드).
# default_server — IP 직접 접속(홈 LAN 등 Host 미일치)은 종전대로 트레이딩 대시보드로.
# 설치: trand 리포 ops/nginx/sync.sh 또는 수동 심링크 → /opt/homebrew/etc/nginx/servers/
server {
    listen 80 default_server;
    server_name trading.feelw00.com;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }
}
